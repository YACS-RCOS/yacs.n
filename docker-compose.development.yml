version: "3.4"

# web (front-end) depends on api (back-end) depends on (db)
# nginx -> web -> api -> db [dependency chain]

volumes:
  web_node_modules:
  postgres_data:
  matomo_db:
  matomo:

services:
  yacs_nginx:
    container_name: yacs_nginx
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - matomo:/var/www/html:z,ro
      - ./src/web/nginx.development.conf:/etc/nginx/nginx.conf
      # - ./matomo.conf:/etc/nginx/conf.d/default.conf:z,ro
    depends_on:
      - yacs_web
      - yacs_matomo

  yacs_web:
    build:
      target: develop-stage
    command: npm run serve
    ports:
      - 8080:8080
    volumes:
      - ./src/web:/app
      - web_node_modules:/app/node_modules/
    environment:
      - YACS_API_HOST=http://yacs_api:4000

  yacs_api:
    command: /bin/bash -c "python tables/database_session.py && PYTHONPATH=. alembic upgrade head && uvicorn app:app --reload --host 0.0.0.0 --port 4000"
    ports:
      - 4000:4000
    volumes:
      - ./src/api:/usr/src
    environment:
      - ENV=development
      - DEBUG=True
      - DB_HOST=yacs_db
      - DB_USER=yacs
      - DB_PASS=${DB_PASS:-easy_dev_pass}
      - DB_NAME=yacs
      - DB_PORT=5432
      - API_SIGN_KEY=${API_SIGN_KEY:-secretKey}

  yacs_db:
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=yacs
      - POSTGRES_USER=yacs
      - POSTGRES_PASSWORD=${DB_PASS:-easy_dev_pass}
      
  matomo_db:
    command: --max-allowed-packet=64MB
    volumes:
      - matomo_db:/var/lib/mysql:Z
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS:-easy_dev_pass}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    env_file:
      - ./.env

  yacs_matomo:
    links:
      - matomo_db
    volumes:
      - matomo:/var/www/html:z
    environment:
      - MATOMO_DATABASE_HOST=matomo_db
      - PHP_MEMORY_LIMIT=2048M
    env_file:
      - ./.env